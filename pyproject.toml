[project]
name = "job-execution-analyser"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Nishank Mahore", email = "nishankmahore@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
]

[project.scripts]
job_execution_analyser = "job_execution_analyser.cli:cli"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = "--cov=job_execution_analyser --cov-report=term-missing"
